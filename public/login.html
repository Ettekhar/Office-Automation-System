<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OfficeOS — Sign In</title>
  <meta name="description" content="Sign in to OfficeOS Enterprise Operations Platform">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('officeos_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --bg-card: rgba(16, 16, 28, 0.85);
      --bg-input: rgba(255,255,255,0.05);
      --bg-input-focus: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.08);
      --border-focus: rgba(99,102,241,0.6);
      --text: #f1f5f9;
      --text-muted: #64748b;
      --text-sub: #94a3b8;
      --accent: #6366f1;
      --accent-glow: rgba(99,102,241,0.25);
      --accent-hover: #818cf8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --google-blue: #4285f4;
    }
    [data-theme="light"] {
      --bg: #f1f5f9;
      --bg-card: rgba(255,255,255,0.92);
      --bg-input: rgba(0,0,0,0.04);
      --bg-input-focus: rgba(0,0,0,0.07);
      --border: rgba(0,0,0,0.1);
      --border-focus: rgba(99,102,241,0.5);
      --text: #0f172a;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
    }

    html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ── Animated Background ── */
    .bg-scene {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .glow {
      position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.4;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .g1 { width: 600px; height: 600px; background: radial-gradient(circle, #6366f1 0%, transparent 70%); top: -200px; left: -200px; animation-delay: 0s; }
    .g2 { width: 500px; height: 500px; background: radial-gradient(circle, #7c3aed 0%, transparent 70%); bottom: -150px; right: -150px; animation-delay: -9s; }
    .g3 { width: 350px; height: 350px; background: radial-gradient(circle, #0ea5e9 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: -4s; opacity: 0.2; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(40px, 30px) scale(1.05); } }

    .grid-overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
    }

    /* ── Card ── */
    .login-card {
      position: relative; z-index: 10;
      width: 100%; max-width: 440px;
      margin: 20px;
      padding: 40px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04) inset;
      animation: slideUp 0.5s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Header ── */
    .logo-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 28px;
    }
    .logo-mark {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(99,102,241,0.4);
      font-size: 20px;
    }
    .logo-text-group { display: flex; flex-direction: column; }
    .logo-name { font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
    .logo-badge {
      font-size: 10px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase;
      color: #818cf8; background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.3);
      border-radius: 4px; padding: 1px 6px; width: fit-content;
    }

    h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
    .sub { font-size: 14px; color: var(--text-sub); margin-bottom: 32px; }

    /* ── Alert ── */
    .alert {
      display: none; padding: 12px 16px; border-radius: 10px;
      font-size: 13px; font-weight: 500; margin-bottom: 20px;
      align-items: center; gap: 8px;
    }
    .alert.show { display: flex; }
    .alert.error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
    .alert.success { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #34d399; }
    .alert.info { background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.3); color: #a5b4fc; }

    /* ── Tabs ── */
    .tabs {
      display: flex; gap: 4px; background: var(--bg-input);
      border-radius: 10px; padding: 4px; margin-bottom: 24px;
    }
    .tab {
      flex: 1; padding: 8px 12px; border-radius: 7px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer;
      background: transparent; color: var(--text-muted); transition: all .2s;
    }
    .tab.active { background: var(--accent); color: #fff; box-shadow: 0 2px 12px rgba(99,102,241,0.4); }

    /* ── Form ── */
    .form-section { display: none; }
    .form-section.active { display: block; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; letter-spacing: 0.3px; text-transform: uppercase; }
    .field input {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      background: var(--bg-input); border: 1px solid var(--border);
      color: var(--text); font-size: 14px; font-family: inherit;
      outline: none; transition: all .2s;
    }
    .field input::placeholder { color: var(--text-muted); }
    .field input:focus { background: var(--bg-input-focus); border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--accent-glow); }

    .field-row { display: flex; gap: 10px; }
    .field-row .field { flex: 1; margin-bottom: 0; }

    .forgot-link {
      float: right; font-size: 12px; color: var(--accent); text-decoration: none;
      font-weight: 500; margin-top: -10px; margin-bottom: 16px; display: block;
    }
    .forgot-link:hover { color: var(--accent-hover); }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%; padding: 13px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: #fff; font-size: 15px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: all .2s; position: relative; overflow: hidden;
      box-shadow: 0 4px 20px rgba(99,102,241,0.35);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(99,102,241,0.45); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-primary .spinner {
      display: none; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
      margin: 0 auto;
    }
    .btn-primary.loading .btn-text { display: none; }
    .btn-primary.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Divider ── */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: var(--text-muted); font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* ── Google Button ── */
    .btn-google {
      width: 100%; padding: 12px; border-radius: 10px;
      background: var(--bg-input); border: 1px solid var(--border);
      color: var(--text); font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 10px; transition: all .2s;
    }
    .btn-google:hover { background: var(--bg-input-focus); border-color: rgba(66,133,244,0.4); box-shadow: 0 0 0 3px rgba(66,133,244,0.12); }
    .btn-google svg { width: 18px; height: 18px; }

    /* ── Footer ── */
    .card-footer { margin-top: 28px; text-align: center; font-size: 12px; color: var(--text-muted); }
    .card-footer a { color: var(--accent); text-decoration: none; font-weight: 500; }

    /* ── Theme toggle ── */
    .theme-btn {
      position: fixed; top: 20px; right: 20px; z-index: 100;
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: all .2s;
    }
    .theme-btn:hover { background: var(--bg-input); color: var(--text); }

    /* ── Role pill info (when Google login resolves role) ── */
    .role-info {
      display: none; margin-top: 16px; padding: 12px 16px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 10px; font-size: 13px; align-items: center; gap: 8px;
    }
    .role-info.show { display: flex; }
    .role-pill {
      padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .role-pill.user { background: rgba(16,185,129,0.2); color: #34d399; }
    .role-pill.admin { background: rgba(245,158,11,0.2); color: #fbbf24; }
    .role-pill.superadmin { background: rgba(99,102,241,0.2); color: #a5b4fc; }

    /* ── Responsive ── */
    @media (max-width: 500px) {
      .login-card { padding: 28px 20px; margin: 12px; }
      h1 { font-size: 20px; }
    }
  </style>
</head>
<body>

<!-- Animated background -->
<div class="bg-scene">
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="glow g3"></div>
</div>
<div class="grid-overlay"></div>

<!-- Theme toggle -->
<button class="theme-btn" id="theme-btn" title="Toggle theme">
  <svg id="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
    <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  </svg>
  <svg id="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="display:none">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>

<!-- Login Card -->
<div class="login-card" role="main">
  <div class="logo-row">
    <div class="logo-mark">⚡</div>
    <div class="logo-text-group">
      <span class="logo-name">OfficeOS</span>
      <span class="logo-badge">v2.4 PRO</span>
    </div>
  </div>

  <h1>Welcome back</h1>
  <p class="sub">Sign in to your enterprise workspace</p>

  <!-- Alert -->
  <div class="alert" id="alert" role="alert">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span id="alert-text"></span>
  </div>

  <!-- Tabs: Email vs Google -->
  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="email" role="tab" id="tab-email">Email & Password</button>
    <button class="tab" data-tab="google" role="tab" id="tab-google">Google OAuth</button>
  </div>

  <!-- ── Email/Password Form ── -->
  <div class="form-section active" id="section-email">
    <form id="email-form" autocomplete="on" novalidate>
      <div class="field">
        <label for="email-input">Email address</label>
        <input type="email" id="email-input" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password-input">Password</label>
        <input type="password" id="password-input" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <a href="#" class="forgot-link" id="forgot-link">Forgot password?</a>

      <button type="submit" class="btn-primary" id="email-btn">
        <div class="spinner"></div>
        <span class="btn-text">Sign In</span>
      </button>
    </form>
  </div>

  <!-- ── Google OAuth Form ── -->
  <div class="form-section" id="section-google">
    <p style="font-size:13px;color:var(--text-sub);margin-bottom:20px;line-height:1.5">
      Sign in with your Google account. Your role is automatically assigned based on your registered email.
    </p>

    <button class="btn-google" id="google-btn" type="button">
      <!-- Google logo SVG -->
      <svg viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        <path fill="none" d="M0 0h48v48H0z"/>
      </svg>
      Continue with Google
    </button>

    <div class="role-info" id="google-role-info">
      <span style="color:var(--text-sub);font-size:13px">Your role:</span>
      <span class="role-pill" id="google-role-pill">user</span>
      <span style="color:var(--text-sub);font-size:13px;margin-left:auto" id="google-role-name"></span>
    </div>
  </div>

  <div class="card-footer">
    <p>🔒 End-to-end encrypted · Enterprise-grade security</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ── Theme ──
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('officeos_theme', t); } catch {}
    document.getElementById('icon-sun').style.display = t === 'dark' ? '' : 'none';
    document.getElementById('icon-moon').style.display = t === 'light' ? '' : 'none';
  }
  const curTheme = (function() { try { return localStorage.getItem('officeos_theme') || 'dark'; } catch { return 'dark'; } })();
  applyTheme(curTheme);
  document.getElementById('theme-btn').addEventListener('click', function () {
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });

  // ── Tabs ──
  document.querySelectorAll('.tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('section-' + tab.dataset.tab).classList.add('active');
      clearAlert();
    });
  });

  // ── Alert helpers ──
  function showAlert(msg, type) {
    var el = document.getElementById('alert');
    el.className = 'alert ' + type + ' show';
    document.getElementById('alert-text').textContent = msg;
  }
  function clearAlert() {
    document.getElementById('alert').className = 'alert';
  }

  // ── Check if already logged in ──
  (async function () {
    try {
      const r = await fetch('/api/auth/me', { credentials: 'include' });
      if (r.ok) {
        const d = await r.json();
        if (d && d.user) {
          window.location.replace('/master.html');
          return;
        }
      }
    } catch {}
  })();

  // ── Email/Password Login ──
  document.getElementById('email-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    clearAlert();
    const btn = document.getElementById('email-btn');
    const email = document.getElementById('email-input').value.trim();
    const password = document.getElementById('password-input').value;
    if (!email || !password) { showAlert('Please enter your email and password.', 'error'); return; }

    btn.classList.add('loading');
    btn.disabled = true;

    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password }),
      });
      const d = await r.json();
      if (r.ok && d.user) {
        showAlert('Signed in successfully! Redirecting…', 'success');
        setTimeout(() => window.location.replace('/master.html'), 600);
      } else {
        showAlert(d.error || d.message || 'Invalid credentials. Please try again.', 'error');
      }
    } catch (err) {
      showAlert('Connection error. Please check your network.', 'error');
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  });

  // ── Google OAuth ──
  document.getElementById('google-btn').addEventListener('click', function () {
    clearAlert();
    // Build redirect URL: the server will redirect back with a code
    const returnTo = encodeURIComponent(window.location.origin + '/master.html');
    window.location.href = '/api/auth/google?returnTo=' + returnTo;
  });

  // ── Handle OAuth callback params in URL ──
  (function () {
    const params = new URLSearchParams(window.location.search);
    const authStatus = params.get('auth');
    const authError = params.get('error');
    if (authStatus === 'success') {
      showAlert('Signed in with Google! Redirecting…', 'success');
      setTimeout(() => window.location.replace('/master.html'), 600);
    } else if (authError) {
      const msgs = {
        'access_denied': 'Google sign-in was cancelled.',
        'not_registered': 'This Google account is not registered in OfficeOS. Contact your admin.',
        'oauth_failed': 'Google sign-in failed. Please try again.',
      };
      showAlert(msgs[authError] || decodeURIComponent(authError), 'error');
      // Switch to Google tab to show the error in context
      document.querySelector('[data-tab="google"]').click();
    } else if (params.get('logout') === '1') {
      showAlert('You have been signed out successfully.', 'info');
    }
    // Clean up URL
    if (params.size > 0) {
      history.replaceState({}, '', window.location.pathname);
    }
  })();

  // ── Forgot password ──
  document.getElementById('forgot-link').addEventListener('click', function (e) {
    e.preventDefault();
    showAlert('Contact your system administrator to reset your password.', 'info');
  });
})();
</script>
</body>
</html>
