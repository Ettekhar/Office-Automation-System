# ═══════════════════════════════════════════════════════════════════════════
# officeos-mailer — Cloudflare Worker config
#
# DEPLOY WITH AN EXPLICIT CONFIG PATH so this can never touch the dev-assistant
# worker sitting next to it:
#
#   npx wrangler --config cloudflare-worker/mailer-wrangler.toml d1 create officeos-mailer
#   npx wrangler --config cloudflare-worker/mailer-wrangler.toml d1 execute \
#     officeos-mailer --file cloudflare-worker/schema.sql
#   npx wrangler --config cloudflare-worker/mailer-wrangler.toml secret put RELAY_TOKEN
#   npx wrangler --config cloudflare-worker/mailer-wrangler.toml secret put ADMIN_TOKEN
#   npx wrangler --config cloudflare-worker/mailer-wrangler.toml secret put GOOGLE_SERVICE_ACCOUNT_JSON
#   npx wrangler --config cloudflare-worker/mailer-wrangler.toml deploy
#
# GOOGLE_SERVICE_ACCOUNT_JSON is the WHOLE service-account.json on ONE line:
#   node -e "process.stdout.write(JSON.stringify(require('./service-account.json')))"
#
# The spreadsheet IDs are the SAME variables src/config.js reads from .env, set as
# Worker secrets rather than vars (see [vars] below for why). They are not a second
# vocabulary - they are the same fact, stated once more in the only place a Worker
# can keep it.
# ═══════════════════════════════════════════════════════════════════════════

name = "officeos-mailer"
main = "mailer-worker.js"
compatibility_date = "2025-09-01"
# reportUtils.js is plain ESM; nodejs_compat gives it a correct module environment.
compatibility_flags = ["nodejs_compat"]

# The ledger. Created 2026-10-02 (`npx wrangler d1 create officeos-mailer`).
# A D1 database id is an identifier, not a credential, so it is safe to commit.
[[d1_databases]]
binding = "DB"
database_name = "officeos-mailer"
database_id = "c3eae9dc-588c-4935-9087-b58404e27532"

[vars]
# The master-sheet ids are NOT here: they are Worker secrets (see below). They were
# originally written into [vars] and that was wrong for a committed file on a public
# remote - a spreadsheet id is the one identifier in this deployment that must not be
# published by accident, and having the name in both places is ambiguous anyway.
#
#   (Get-Content .env | Select-String '^CW_SPREADSHEET_ID=').Split('=')[1].Trim() |
#     npx wrangler secret put CW_SPREADSHEET_ID --config cloudflare-worker/mailer-wrangler.toml
#
# accountsFor() treats a blank or "REPLACE_WITH_..." id as UNCONFIGURED, so a deploy
# whose ids were never set comes up with zero accounts and /api/health says
# configuredAccounts: [] rather than quietly reading the wrong sheet.
#
# npm run send has no equivalent guard - see docs/cloudflare-mail-relay.md.
CW_MASTER_TAB_NAME = "Website List"
RM_MASTER_TAB_NAME = "Website List"
CW_NAME = "CW Maintenance"
RM_NAME = "RM Maintenance"
# Cap on the stored email body. A report with inline CID images can exceed this;
# when it does the row is marked htmlTruncated rather than silently shortened.
MAX_HTML_CHARS = "400000"

# Secrets (never in this file):
#   RELAY_TOKEN                 — bearer token the local agent presents
#   ADMIN_TOKEN                 — gate on /api/run, /api/report, /api/overview
#   GOOGLE_SERVICE_ACCOUNT_JSON — service account, spreadsheets.readonly scope
#   CW_SPREADSHEET_ID / RM_SPREADSHEET_ID — the live master sheets