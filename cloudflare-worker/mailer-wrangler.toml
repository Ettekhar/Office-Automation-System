# ═══════════════════════════════════════════════════════════════════════════
# officeos-mailer — Cloudflare Worker config
#
# DEPLOY WITH AN EXPLICIT CONFIG PATH so this can never touch the dev-assistant
# worker sitting next to it:
#
#   npx wrangler --config cloudflare-worker/mailer-wrangler.toml d1 create officeos-mailer
#   npx wrangler --config cloudflare-worker/mailer-wrangler.toml d1 execute \
#     officeos-mailer --file cloudflare-worker/schema.sql
#   npx wrangler --config cloudflare-worker/mailer-wrangler.toml secret put RELAY_TOKEN
#   npx wrangler --config cloudflare-worker/mailer-wrangler.toml secret put ADMIN_TOKEN
#   npx wrangler --config cloudflare-worker/mailer-wrangler.toml secret put GOOGLE_SERVICE_ACCOUNT_JSON
#   npx wrangler --config cloudflare-worker/mailer-wrangler.toml deploy
#
# GOOGLE_SERVICE_ACCOUNT_JSON is the WHOLE service-account.json on ONE line:
#   node -e "process.stdout.write(JSON.stringify(require('./service-account.json')))"
#
# The spreadsheet IDs below are the SAME variables src/config.js reads from .env.
# They are not a second vocabulary - they are the same fact, stated once more in
# the only place a Worker can keep it. They ship as placeholders because this file
# is committed to a public remote; paste the real values from .env before deploy.
# ═══════════════════════════════════════════════════════════════════════════

name = "officeos-mailer"
main = "mailer-worker.js"
compatibility_date = "2025-09-01"
# reportUtils.js is plain ESM; nodejs_compat gives it a correct module environment.
compatibility_flags = ["nodejs_compat"]

# The ledger. Create the database first, then paste the id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "officeos-mailer"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
# Live master sheets. SAME VALUES as .env CW_SPREADSHEET_ID / RM_SPREADSHEET_ID -
# paste them in from your .env before deploying. They are placeholders here because
# this file is committed and the GitHub remote is PUBLIC, and a spreadsheet id is
# the one thing in the deployment that must not be published by accident.
#
# Leaving a placeholder is SAFE, unlike the CLI's behaviour: accountsFor() drops
# any account with no spreadsheet id, so the Worker comes up with zero configured
# accounts and /api/health reports configuredAccounts: [] instead of quietly
# reading the wrong sheet. (npm run send has no such guard - see the docs.)
CW_SPREADSHEET_ID = "REPLACE_WITH_CW_SPREADSHEET_ID"
RM_SPREADSHEET_ID = "REPLACE_WITH_RM_SPREADSHEET_ID"
CW_MASTER_TAB_NAME = "Website List"
RM_MASTER_TAB_NAME = "Website List"
CW_NAME = "CW Maintenance"
RM_NAME = "RM Maintenance"
# Cap on the stored email body. A report with inline CID images can exceed this;
# when it does the row is marked htmlTruncated rather than silently shortened.
MAX_HTML_CHARS = "400000"

# Secrets (never here):
#   RELAY_TOKEN                 — bearer token the local agent presents
#   ADMIN_TOKEN                 — optional gate on /api/run, /api/report, /api/overview
#   GOOGLE_SERVICE_ACCOUNT_JSON — service account, spreadsheets.readonly scope